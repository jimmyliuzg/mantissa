name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "pyproject.toml", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages deploy needs write access for the gh-pages branch / deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't pile up old deploys if a fast-forward happens.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build mantissa wheel
        run: bash web/scripts/build-wheel.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc -b --pretty
      - name: Unit tests
        working-directory: web
        run: npx vitest run
      - name: Vite build
        working-directory: web
        env:
          VITE_BASE: /mantissa/
        run: npx vite build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
