[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mantissa"
version = "0.1.0"
description = "An open-source retirement planner with Monte Carlo simulation, withdrawal modeling, and scenario comparison."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Jimmy Liu", email = "jimmyliuzg@gmail.com" },
]
keywords = [
    "retirement",
    "planning",
    "monte-carlo",
    "finance",
    "investment",
    "social-security",
    "roth-conversion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.0",
    "tabulate>=0.9",
    "matplotlib>=3.7",
]

[project.scripts]
mantissa = "retirement_planner.cli:main"

[project.urls]
Homepage = "https://github.com/jimmyliuzg/mantissa"
Repository = "https://github.com/jimmyliuzg/mantissa"
Issues = "https://github.com/jimmyliuzg/mantissa/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/retirement_planner"]
